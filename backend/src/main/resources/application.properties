# =====================================
# Application
# =====================================
spring.application.name=backend
app.base-url=http://localhost:8080
spring.config.import=optional:classpath:application-local.properties

# =====================================
# Database Configuration (Auto-detects MySQL or PostgreSQL)
# =====================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civicpulse_project}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:AbdulAlienX20@}

# =====================================
# JPA / Hibernate Configuration
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================
# Server & Response Compression
# =====================================
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =====================================
# Connection Pool Tuning (HikariCP)
# =====================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# =====================================
# JWT Configuration
# =====================================
jwt.secret=VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUQXV0aGVudGljYXRpb24xMjM0NTY3ODkw
jwt.expiration-ms=86400000

# =====================================
# Mail Configuration (Gmail SMTP)
# =====================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:civicpulse.system@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.enabled=true

# =====================================
# Logging
# =====================================
logging.level.root=WARN
logging.level.com.civicpulse.backend=INFO
logging.level.org.springframework.security=WARN
