services:
  # ==============================================================================
  # CivicPulse Backend Service (Spring Boot / Java 17)
  # ==============================================================================
  - type: web
    name: civicpulse-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/auth/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: civicpulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_MAIL_ENABLED
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  # ==============================================================================
  # CivicPulse Relational Database
  # ==============================================================================
  - name: civicpulse-db
    databaseName: civicpulse_project
    plan: free
    region: oregon
