<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="cpPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cpBg)" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Civic City Towers (Semi-transparent silhouette) -->
  <rect x="18" y="27" width="7" height="23" rx="1.5" fill="#14b8a6" fill-opacity="0.25"/>
  <rect x="28.5" y="19" width="7" height="31" rx="1.5" fill="#14b8a6" fill-opacity="0.4"/>
  <rect x="39" y="24" width="7" height="26" rx="1.5" fill="#14b8a6" fill-opacity="0.25"/>

  <!-- Pulse Wave Lifeline -->
  <path d="M 10 40 L 22 40 L 26 44 L 32 15 L 38 49 L 43 38 L 47 41 L 54 40" 
        stroke="url(#cpPulse)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cpGlow)"/>

  <!-- Beacon Pulse Point -->
  <circle cx="32" cy="15" r="3" fill="#ffffff"/>
  <circle cx="32" cy="15" r="5.5" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
</svg>
