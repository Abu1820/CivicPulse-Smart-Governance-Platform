<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="logoPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="textPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="56" height="56" rx="15" fill="url(#logoBg)" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Civic Towers -->
    <rect x="15" y="24" width="6.5" height="21" rx="1.5" fill="#14b8a6" fill-opacity="0.25"/>
    <rect x="24.5" y="17" width="7" height="28" rx="1.5" fill="#14b8a6" fill-opacity="0.4"/>
    <rect x="34.5" y="21" width="6.5" height="24" rx="1.5" fill="#14b8a6" fill-opacity="0.25"/>
    <!-- Heartbeat Pulse Line -->
    <path d="M 8 36 L 19 36 L 22.5 40 L 28 13 L 33.5 44 L 38 34 L 42 37 L 48 36" 
          stroke="url(#logoPulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#logoGlow)"/>
    <!-- Apex Beacon -->
    <circle cx="28" cy="13" r="2.5" fill="#ffffff"/>
    <circle cx="28" cy="13" r="5" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
  </g>

  <!-- Typography: CivicPulse -->
  <text x="74" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="27" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#f8fafc">Civic</tspan>
    <tspan fill="url(#textPulseGrad)">Pulse</tspan>
  </text>

  <!-- Tagline: SMART GOVERNANCE -->
  <text x="75" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="9" font-weight="700" letter-spacing="2.2" fill="#94a3b8">
    SMART GOVERNANCE
  </text>
  <!-- Mini Pulse Accent Dot -->
  <circle cx="206" cy="47" r="2" fill="#2dd4bf"/>
</svg>
